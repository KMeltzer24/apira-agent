services:
  agent:
    build: .
    ports:
      - "8100:8100"
    environment:
      # Backend and research MCP servers on the EC2 host.
      - MCP_URL=${MCP_URL:-http://host.docker.internal:8000/mcp}
      - RAG_MCP_URL=${RAG_MCP_URL:-http://host.docker.internal:8200/mcp}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
