services:
  agent:
    build: .
    ports:
      - "8100:8100"
    environment:
      # MCP server. On EC2 (next to apira-mcp) use host.docker.internal:8000;
      # from a Mac it would be the EC2 public IP. Override via .env.
      - MCP_URL=${MCP_URL:-http://host.docker.internal:8000/mcp}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
